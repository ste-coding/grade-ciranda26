<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#012462">
<title>CirandaMEJ'26 — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=Barriecito&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff1596;
  --pink-light:#ffbfcd;
  --navy:#012462;
  --navy-deep:#011a48;
  --yellow:#ffe36c;
  --burgundy:#8d0b53;
  --voz:#ff1596;
  --eco:#ffe36c;
  --acorde:#ffbfcd;
  --geral:#5a6b94;
  --accent:#ff1596;
  --ink:#ffffff;
  --ink-soft:rgba(255,255,255,.62);
  --card:rgba(255,255,255,.06);
  --card-line:rgba(255,255,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--navy);
  background-image:
    radial-gradient(120% 90% at 85% -10%, rgba(255,21,150,.28) 0%, transparent 50%),
    radial-gradient(110% 80% at -10% 110%, rgba(255,227,108,.16) 0%, transparent 55%),
    radial-gradient(circle at 50% 50%, var(--navy) 0%, var(--navy-deep) 100%);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:96px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(1,26,72,.86);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--card-line);
}
.head-inner{max-width:560px;margin:0 auto;padding:14px 16px 12px}
.brandrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{line-height:.92}
.brand .ciranda{font-family:'Dela Gothic One',cursive;font-size:23px;letter-spacing:-.5px;color:var(--ink)}
.brand .ciranda em{font-style:normal;color:var(--pink)}
.brand .sub{font-family:'Barriecito',cursive;font-size:13px;color:var(--yellow);letter-spacing:.5px;margin-top:3px}
.clock{
  font-family:'Dela Gothic One',cursive;
  font-size:22px;color:var(--yellow);
  font-variant-numeric:tabular-nums;
  text-align:right;line-height:1;
}
.clock .date{display:block;font-family:'IBM Plex Sans';font-size:10px;font-weight:600;color:var(--ink-soft);letter-spacing:.8px;text-transform:uppercase;margin-top:5px}

/* ===== NOW banner ===== */
.nowbar{
  margin-top:12px;
  border-radius:18px;
  background:linear-gradient(100deg,var(--pink),var(--burgundy));
  padding:11px 14px;
  display:flex;align-items:center;gap:11px;
  box-shadow:0 0 0 1px rgba(255,191,205,.25) inset;
}
.nowbar.idle{background:rgba(255,255,255,.07);box-shadow:0 0 0 1px var(--card-line) inset}
.pulse{flex:none;width:11px;height:11px;border-radius:50%;background:var(--yellow);position:relative}
.pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--yellow);animation:ping 1.4s ease-out infinite}
.nowbar.idle .pulse{background:var(--ink-soft)}
.nowbar.idle .pulse::after{display:none}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.nowtext{min-width:0;flex:1}
.nowtext .lab{font-family:'Barriecito',cursive;font-size:12px;letter-spacing:1.5px;color:var(--yellow);text-transform:uppercase}
.nowbar.idle .nowtext .lab{color:var(--ink-soft)}
.nowtext .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.nowtext .mt{font-size:11.5px;color:rgba(255,255,255,.8);margin-top:1px}

/* ===== Pillar filter ===== */
.filters{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:none;border:1.5px solid var(--card-line);background:transparent;color:var(--ink-soft);
  font-family:'IBM Plex Sans';font-weight:600;font-size:13px;
  padding:7px 15px;border-radius:999px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;transform:translateY(-1px)}
.chip[data-f="voz"] .dot{background:var(--voz)}
.chip[data-f="eco"] .dot{background:var(--eco)}
.chip[data-f="acorde"] .dot{background:var(--acorde)}
.chip[data-f="todos"] .dot{background:var(--ink)}
.chip.on{color:var(--navy);background:var(--ink);border-color:var(--ink)}
.chip[data-f="voz"].on{background:var(--voz);border-color:var(--voz);color:#fff}
.chip[data-f="eco"].on{background:var(--eco);border-color:var(--eco);color:var(--navy)}
.chip[data-f="acorde"].on{background:var(--acorde);border-color:var(--acorde);color:var(--burgundy)}

/* ===== Content ===== */
main{padding-top:6px}
.daytitle{font-family:'Dela Gothic One',cursive;font-size:14px;color:var(--ink-soft);margin:16px 2px 8px;letter-spacing:-.3px}

/* timeline item */
.item{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--card-line);
  border-radius:18px;padding:14px 15px 14px 17px;margin-bottom:11px;
  cursor:pointer;transition:.18s;overflow:hidden;color:inherit;
}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--geral)}
.item[data-p="voz"]::before{background:var(--voz)}
.item[data-p="eco"]::before{background:var(--eco)}
.item[data-p="acorde"]::before{background:var(--acorde)}
.item:active{transform:scale(.985)}
.item.past{opacity:.42}
.item.next{border-color:rgba(255,227,108,.35)}
.item.current{
  background:linear-gradient(110deg,rgba(255,21,150,.22),rgba(141,11,83,.18));
  border-color:var(--pink);
  box-shadow:0 0 0 1px var(--pink) inset, 0 8px 30px -12px rgba(255,21,150,.8);
}
.itime{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.itime .hr{font-family:'Dela Gothic One',cursive;font-size:14px;color:var(--yellow)}
.item.past .itime .hr{color:var(--ink-soft)}
.livetag{
  font-family:'Barriecito',cursive;font-size:11px;letter-spacing:1px;
  background:var(--yellow);color:var(--navy);padding:2px 9px;border-radius:999px;
  display:inline-flex;align-items:center;gap:5px;
}
.livetag .d{width:6px;height:6px;border-radius:50%;background:var(--burgundy);animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:.2}}
.nexttag{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--yellow);text-transform:uppercase}
.ititle{font-weight:700;font-size:15.5px;line-height:1.25;margin:7px 0 4px}
.imeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--ink-soft)}
.imeta b{color:var(--ink);font-weight:600}
.pill-badge{font-family:'Barriecito',cursive;font-size:11px;letter-spacing:.6px;padding:1px 8px;border-radius:6px}
.pill-badge.voz{background:rgba(255,21,150,.2);color:var(--pink-light)}
.pill-badge.eco{background:rgba(255,227,108,.18);color:var(--yellow)}
.pill-badge.acorde{background:rgba(255,191,205,.18);color:var(--pink-light)}
.pill-badge.geral{background:rgba(255,255,255,.1);color:var(--ink-soft)}

/* Por sala */
.room-group{margin-bottom:22px}
.room-head{font-family:'Dela Gothic One',cursive;font-size:15px;margin:0 2px 10px;display:flex;align-items:center;gap:9px}
.room-head .ico{width:9px;height:22px;border-radius:4px;background:var(--pink)}

/* Agora cards */
.agora-room{background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:15px 16px;margin-bottom:12px}
.agora-room.live{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.agora-room .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.agora-room .rh .rn{font-family:'Dela Gothic One',cursive;font-size:14px}
.agora-room .empty{color:var(--ink-soft);font-size:13px;font-style:italic}
.agora-room .cur{font-weight:700;font-size:15px;line-height:1.25}
.agora-room .cur .t{font-family:'Dela Gothic One',cursive;font-size:12px;color:var(--yellow);display:block;margin-bottom:3px}
.agora-room .nx{margin-top:10px;padding-top:10px;border-top:1px solid var(--card-line);font-size:12.5px;color:var(--ink-soft)}
.agora-room .nx b{color:var(--ink)}

.empty-state{text-align:center;color:var(--ink-soft);padding:50px 20px;font-size:14px}
.empty-state .big{font-family:'Dela Gothic One',cursive;font-size:40px;display:block;margin-bottom:12px}

/* ===== Tab bar ===== */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:rgba(1,26,72,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--card-line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
}
.nav-inner{max-width:560px;margin:0 auto;display:flex;gap:8px}
.tab{
  flex:1;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;
  padding:8px 4px 6px;border-radius:14px;transition:.16s;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:11px;font-weight:600;letter-spacing:.2px}
.tab.on{color:var(--navy);background:var(--pink)}
.tab.on svg{stroke:#fff}
.tab.on span{color:#fff}

/* ===== Modal ===== */
.modal-bg{
  position:fixed;inset:0;z-index:100;background:rgba(1,12,40,.72);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.modal-bg.open{opacity:1;pointer-events:auto}
.modal{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--navy-deep);border:1px solid var(--card-line);
  border-radius:26px 26px 0 0;padding:8px 20px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(30px);transition:transform .26s cubic-bezier(.2,.9,.3,1);
  border-top:4px solid var(--pink);
}
.modal-bg.open .modal{transform:translateY(0)}
.grip{width:42px;height:5px;border-radius:99px;background:var(--card-line);margin:8px auto 16px}
.m-pill{display:inline-block;font-family:'Barriecito',cursive;font-size:13px;letter-spacing:1px;padding:3px 12px;border-radius:8px;margin-bottom:10px}
.m-pill.voz{background:var(--voz);color:#fff}
.m-pill.eco{background:var(--eco);color:var(--navy)}
.m-pill.acorde{background:var(--acorde);color:var(--burgundy)}
.m-pill.geral{background:var(--geral);color:#fff}
.m-time{font-family:'Dela Gothic One',cursive;font-size:18px;color:var(--yellow);margin-bottom:6px}
.m-title{font-family:'Dela Gothic One',cursive;font-size:22px;line-height:1.18;margin-bottom:18px;letter-spacing:-.4px}
.m-rows{display:flex;flex-direction:column;gap:1px;border-radius:16px;overflow:hidden;margin-bottom:18px;border:1px solid var(--card-line)}
.m-row{display:flex;gap:12px;padding:12px 14px;background:var(--card)}
.m-row .k{flex:none;width:96px;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;font-weight:600;padding-top:1px}
.m-row .v{flex:1;font-size:14px;font-weight:500}
.m-brief h4{font-family:'Barriecito',cursive;font-size:15px;letter-spacing:1px;color:var(--pink-light);margin-bottom:8px}
.m-brief p{font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.9)}
.m-close{
  width:100%;margin-top:20px;border:none;cursor:pointer;
  background:var(--pink);color:#fff;font-family:'IBM Plex Sans';font-weight:700;font-size:15px;
  padding:14px;border-radius:16px;
}
.loading{text-align:center;padding:70px 20px;color:var(--ink-soft);font-family:'Dela Gothic One',cursive}

/* edit link */
.editlink{position:fixed;top:14px;right:50%;transform:translateX(280px);z-index:60}
@media(max-width:592px){.editlink{transform:none;right:14px}}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brandrow">
      <div class="brand">
        <div class="ciranda">Ciranda<em>MEJ</em>'26</div>
        <div class="sub">painel da staff</div>
      </div>
      <div class="clock" id="clock">--:--<span class="date" id="cdate"></span></div>
    </div>
    <div class="nowbar idle" id="nowbar">
      <div class="pulse"></div>
      <div class="nowtext">
        <div class="lab" id="nowlab">aguardando</div>
        <div class="nm" id="nowname">— sem pauta no ar —</div>
        <div class="mt" id="nowmeta"></div>
      </div>
    </div>
    <div class="filters" id="filters">
      <button class="chip on" data-f="todos"><span class="dot"></span>Todos</button>
      <button class="chip" data-f="voz"><span class="dot"></span>Voz</button>
      <button class="chip" data-f="eco"><span class="dot"></span>Eco</button>
      <button class="chip" data-f="acorde"><span class="dot"></span>Acorde</button>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="loading">carregando grade…</div>
</main>

<nav>
  <div class="nav-inner">
    <button class="tab on" data-tab="timeline">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      <span>Timeline</span>
    </button>
    <button class="tab" data-tab="sala">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21V12h6v9"/></svg>
      <span>Por Sala</span>
    </button>
    <button class="tab" data-tab="agora">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0"/><path d="M2 12a10 10 0 0 1 20 0"/></svg>
      <span>Agora</span>
    </button>
  </div>
</nav>

<div class="modal-bg" id="modalbg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
/* ============================================================
   CONFIG JSONBIN — cole aqui os dados do seu bin
   ------------------------------------------------------------
   BIN_ID     = o ID do bin (ex: '665f...')
   ACCESS_KEY = a X-Access-Key de LEITURA (somente leitura)
   Como gerar: ver o README, seção "JSONBin".
   ============================================================ */
const BIN_ID     = '6a190a48ddf5aa59f772a4ad';
const ACCESS_KEY = '$2a$10$N6FZRPc/zPdeL4do.S7Vb.ZTmjlQ4A9kEEZPuu5.YeZwN0ubdsbia';
const BIN_BASE   = 'https://api.jsonbin.io/v3/b';
/* ============================================================ */

const PILAR_LABEL = {voz:'Voz',eco:'Eco',acorde:'Acorde',geral:'Geral'};
let DATA = [];
let state = {tab:'timeline', filter:'todos'};

/* ---- time helpers ---- */
const toMin = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function statusOf(it){
  const n=nowMin(), s=toMin(it.inicio), e=toMin(it.fim);
  if(s==null) return 'next';
  if(e!=null && n>=s && n<e) return 'current';
  if(n>=s && (e==null || n>=e)) return 'past';
  return 'next';
}

/* ---- load (JSONBin com fallback para data.json local) ---- */
function loadGrade(){
  return fetch(`${BIN_BASE}/${BIN_ID}/latest`, {headers:{'X-Access-Key':ACCESS_KEY}})
    .then(r=>{ if(!r.ok) throw new Error('bin '+r.status); return r.json(); })
    .then(j=> Array.isArray(j) ? j : j.record);
}
loadGrade()
  .catch(e=>{ console.warn('[CirandaMEJ] Bin indisponível, usando data.json local:', e.message); return fetch('./data.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }); })
  .then(d=>{ DATA=d.slice().sort((a,b)=>(toMin(a.inicio)??0)-(toMin(b.inicio)??0)); render(); setInterval(tick,1000); tick(); })
  .catch(e=>{ document.getElementById('main').innerHTML='<div class="empty-state"><span class="big">:(</span>Não consegui carregar a grade.<br>Confira o <b>BIN_ID</b> e a <b>ACCESS_KEY</b> no topo do arquivo.</div>'; });

/* ---- clock + now ---- */
function tick(){
  const d=new Date();
  const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
  const clk=document.getElementById('clock');
  clk.childNodes[0].nodeValue = hh+':'+mm;
  const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  document.getElementById('cdate').textContent = dias[d.getDay()]+' '+d.getDate()+' '+meses[d.getMonth()];
  updateNow();
  if(state.tab==='timeline') refreshTimelineStatus();
  if(state.tab==='agora') render();
}
function currentItems(){ return DATA.filter(it=>statusOf(it)==='current'); }
function updateNow(){
  const cur=currentItems();
  const bar=document.getElementById('nowbar');
  const lab=document.getElementById('nowlab'), nm=document.getElementById('nowname'), mt=document.getElementById('nowmeta');
  if(cur.length){
    bar.classList.remove('idle');
    lab.textContent='ao vivo agora';
    if(cur.length===1){ nm.textContent=cur[0].titulo; mt.textContent=(cur[0].sala||'—')+' · até '+cur[0].fim; }
    else { nm.textContent=cur.length+' pautas simultâneas'; mt.textContent=cur.map(c=>c.sala).filter(Boolean).join(' · '); }
  } else {
    const nx=DATA.find(it=>statusOf(it)==='next');
    bar.classList.add('idle');
    if(nx){ lab.textContent='a seguir'; nm.textContent=nx.titulo; mt.textContent=nx.inicio+' · '+(nx.sala||'—'); }
    else { lab.textContent='evento encerrado'; nm.textContent='— sem pauta no ar —'; mt.textContent=''; }
  }
}

/* ---- filter / tabs ---- */
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  state.filter=b.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  render();
});
document.querySelector('nav').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  state.tab=b.dataset.tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  render();
});
function pass(it){ return state.filter==='todos' || it.pilar===state.filter; }

/* ---- render ---- */
function render(){
  const m=document.getElementById('main');
  if(!DATA.length) return;
  if(state.tab==='timeline') m.innerHTML=renderTimeline();
  else if(state.tab==='sala') m.innerHTML=renderSala();
  else m.innerHTML=renderAgora();
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function itemCard(it){
  const st=statusOf(it);
  let tag='';
  if(st==='current') tag='<span class="livetag"><span class="d"></span>NO AR</span>';
  else if(st==='next' && isNextUp(it)) tag='<span class="nexttag">a seguir</span>';
  const pl=it.pilar||'geral';
  const meta=[];
  if(it.sala) meta.push('<b>'+esc(it.sala)+'</b>');
  if(it.palestrante) meta.push(esc(it.palestrante));
  return `<button class="item ${st}" data-p="${pl}" data-id="${it.id}">
    <div class="itime"><span class="hr">${esc(it.inicio)}${it.fim?'–'+esc(it.fim):''}</span>${tag}</div>
    <div class="ititle">${esc(it.titulo)}</div>
    <div class="imeta"><span class="pill-badge ${pl}">${PILAR_LABEL[pl]||pl}</span>${meta.map(x=>'<span>'+x+'</span>').join('')}</div>
  </button>`;
}
let _nextId=null;
function isNextUp(it){ return it.id===_nextId; }
function computeNextUp(){ const nx=DATA.find(it=>statusOf(it)==='next'); _nextId = nx?nx.id:null; }

function renderTimeline(){
  computeNextUp();
  const list=DATA.filter(pass);
  if(!list.length) return '<div class="empty-state"><span class="big">∅</span>Nenhuma pauta para este pilar.</div>';
  return '<div class="daytitle">grade do dia · '+list.length+' pautas</div>'+list.map(itemCard).join('');
}
function refreshTimelineStatus(){
  computeNextUp();
  document.querySelectorAll('.item').forEach(el=>{
    const it=DATA.find(x=>x.id==el.dataset.id); if(!it) return;
    const st=statusOf(it);
    el.classList.remove('past','current','next'); el.classList.add(st);
    const itime=el.querySelector('.itime');
    let tag=''; if(st==='current') tag='<span class="livetag"><span class="d"></span>NO AR</span>';
    else if(st==='next'&&isNextUp(it)) tag='<span class="nexttag">a seguir</span>';
    itime.innerHTML='<span class="hr">'+esc(it.inicio)+(it.fim?'–'+esc(it.fim):'')+'</span>'+tag;
  });
}

function renderSala(){
  const list=DATA.filter(pass);
  const rooms={};
  list.forEach(it=>{ const r=it.sala||'Sem sala definida'; (rooms[r]=rooms[r]||[]).push(it); });
  const names=Object.keys(rooms);
  if(!names.length) return '<div class="empty-state"><span class="big">∅</span>Nenhuma pauta para este pilar.</div>';
  return names.map(r=>`<div class="room-group">
    <div class="room-head"><span class="ico"></span>${esc(r)}</div>
    ${rooms[r].map(itemCard).join('')}
  </div>`).join('');
}

function renderAgora(){
  computeNextUp();
  const rooms={};
  DATA.filter(pass).forEach(it=>{ const r=it.sala; if(!r) return; (rooms[r]=rooms[r]||[]).push(it); });
  const names=Object.keys(rooms);
  if(!names.length) return '<div class="empty-state"><span class="big">∅</span>Nenhuma sala para este pilar.</div>';
  let any=false;
  const html=names.map(r=>{
    const items=rooms[r].slice().sort((a,b)=>(toMin(a.inicio)??0)-(toMin(b.inicio)??0));
    const cur=items.find(it=>statusOf(it)==='current');
    const nxt=items.find(it=>statusOf(it)==='next');
    if(cur) any=true;
    return `<div class="agora-room ${cur?'live':''}" ${cur?`data-id="${cur.id}"`:''}>
      <div class="rh"><span class="rn">${esc(r)}</span>${cur?'<span class="livetag"><span class="d"></span>NO AR</span>':'<span class="nexttag">livre</span>'}</div>
      ${cur
        ? `<div class="cur"><span class="t">${esc(cur.inicio)}–${esc(cur.fim)}</span>${esc(cur.titulo)}</div>`
        : `<div class="empty">Nada acontecendo agora.</div>`}
      ${nxt?`<div class="nx">a seguir · <b>${esc(nxt.inicio)}</b> — ${esc(nxt.titulo)}</div>`:''}
    </div>`;
  }).join('');
  const banner = any?'':'<div class="daytitle">Nenhuma pauta no ar neste momento. Veja o que vem a seguir em cada sala.</div>';
  return banner+html;
}

/* ---- modal ---- */
document.getElementById('main').addEventListener('click',e=>{
  const el=e.target.closest('[data-id]'); if(!el) return;
  openModal(el.dataset.id);
});
function openModal(id){
  const it=DATA.find(x=>x.id==id); if(!it) return;
  const pl=it.pilar||'geral';
  const rows=[];
  rows.push(['Horário', esc(it.inicio)+(it.fim?' — '+esc(it.fim):'')]);
  if(it.sala) rows.push(['Sala', esc(it.sala)]);
  if(it.palestrante) rows.push(['Palestrante', esc(it.palestrante)]);
  if(it.publico) rows.push(['Público-alvo', esc(it.publico)]);
  if(it.formato) rows.push(['Formato', esc(it.formato)]);
  if(it.tipo) rows.push(['Tipo', esc(it.tipo)]);
  document.getElementById('modal').innerHTML=`
    <div class="grip"></div>
    <span class="m-pill ${pl}">${PILAR_LABEL[pl]||pl}</span>
    <div class="m-time">${esc(it.inicio)}${it.fim?' – '+esc(it.fim):''}</div>
    <div class="m-title">${esc(it.titulo)}</div>
    <div class="m-rows">${rows.map(r=>`<div class="m-row"><div class="k">${r[0]}</div><div class="v">${r[1]}</div></div>`).join('')}</div>
    ${it.resumo?`<div class="m-brief"><h4>briefing</h4><p>${esc(it.resumo)}</p></div>`:'<div class="m-brief"><p style="color:var(--ink-soft);font-style:italic">Sem briefing cadastrado.</p></div>'}
    <button class="m-close" id="mclose">Fechar</button>`;
  document.getElementById('modalbg').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){ document.getElementById('modalbg').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('modalbg').addEventListener('click',e=>{
  if(e.target.id==='modalbg' || e.target.id==='mclose') closeModal();
});
</script>
